<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Deep Glassy Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    
    <!-- Vibrant Social & AI Gradient (Pink to Cyan) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGlow)" stroke="url(#brandGrad)" stroke-width="5" />

  <!-- Abstract Social Media / Post Cards Symbol -->
  <g filter="url(#softGlow)" transform="translate(50, 50) scale(0.9) translate(-50, -50)">
    <!-- Back Chat/Post Bubble -->
    <rect x="25" y="30" width="40" height="30" rx="8" fill="rgba(139, 92, 246, 0.3)" stroke="#8b5cf6" stroke-width="2" />
    
    <!-- Front Main Post Bubble (Representing Tweets/Posts) -->
    <rect x="35" y="42" width="40" height="30" rx="8" fill="url(#brandGrad)" />
    <!-- Mini text lines inside the front card -->
    <line x1="43" y1="52" x2="67" y2="52" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="43" y1="60" x2="57" y2="60" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />

    <!-- AI Magic Sparkle Bursting from Top-Right -->
    <path d="M72 18 C72 26, 64 28, 64 28 C64 28, 72 30, 72 38 C72 30, 80 28, 80 28 C80 28, 72 26, 72 18 Z" fill="#06b6d4" />
    <path d="M30 25 C30 29, 26 30, 26 30 C26 30, 30 31, 30 35 C30 31, 34 30, 34 30 C34 30, 30 29, 30 25 Z" fill="#ec4899" />
  </g>
</svg>
